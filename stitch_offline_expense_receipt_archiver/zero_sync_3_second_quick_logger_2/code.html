<script>
  (function() {
    const amountEl = document.getElementById('amount-val');
    const buttons = document.querySelectorAll('.keypad-btn');
    let currentVal = '48.50';

    buttons.forEach((btn) => {
      btn.addEventListener('click', () => {
        const txt = btn.textContent.trim();
        if (txt === 'backspace' || btn.querySelector('.material-symbols-outlined')) {
          currentVal = currentVal.slice(0, -1);
          if (!currentVal) currentVal = '0';
        } else if (txt === '.') {
          if (!currentVal.includes('.')) {
            currentVal += '.';
          }
        } else {
          if (currentVal === '0' || currentVal === '0.00') {
            currentVal = txt;
          } else {
            // Simple limit check to prevent screen overflow
            if (currentVal.length < 9) {
              currentVal += txt;
            }
          }
        }
        amountEl.textContent = currentVal;
      });
    });

    // Quick tag interaction
    const tags = document.querySelectorAll('.tag-pill');
    tags.forEach(tag => {
      tag.addEventListener('click', () => {
        const isSelected = tag.classList.contains('bg-primary-container');
        if (isSelected) {
          tag.classList.remove('bg-primary-container', 'text-on-primary-container', 'border-primary/30');
          tag.classList.add('bg-surface-container', 'text-on-surface-variant', 'border-outline-variant/50');
          const icon = tag.querySelector('.material-symbols-outlined');
          if (icon) icon.remove();
        } else {
          tag.classList.add('bg-primary-container', 'text-on-primary-container', 'border-primary/30');
          tag.classList.remove('bg-surface-container', 'text-on-surface-variant', 'border-outline-variant/50');
          if (!tag.querySelector('.material-symbols-outlined')) {
            const check = document.createElement('span');
            check.className = 'material-symbols-outlined text-[14px]';
            check.textContent = 'check';
            tag.appendChild(check);
          }
        }
      });
    });
  })();
